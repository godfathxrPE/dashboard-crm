# Supabase config — Sprint 28
# Edge Function ai-summarize работает под JWT вызывающего юзера.
# verify_jwt = true: шлюз отклоняет запросы без валидного JWT ещё до функции
# (defense-in-depth); внутри функция дополнительно требует реального юзера
# (auth.getUser) — анонимный ключ до записи не доходит.

[functions.ai-summarize]
verify_jwt = true

# Sprint AI-1: generic AI-прогон по транскрипту (ai-run). Тот же контур, что ai-summarize:
# JWT вызывающего, RLS решает доступ, ключ Anthropic из secrets. Асинхронное исполнение
# (EdgeRuntime.waitUntil) — статус прогона живёт в таблице ai_runs.
[functions.ai-run]
verify_jwt = true

# S-R2-WEBHOOK-TRANSPORT (B2): диспетчер очереди исходящих вебхуков.
#
# ⚠️ verify_jwt = false — ЕДИНСТВЕННАЯ функция проекта без проверки JWT на шлюзе,
#    и это вынужденно: её зовёт БД (dispatch_webhooks_tick, 089) через pg_net,
#    а у БД JWT нет. Взамен — своя авторизация: заголовок X-Dispatch-Key
#    сверяется constant-time с Function Secret WEBHOOK_DISPATCH_KEY.
#
#    Второй контур: функция НЕ ПРИНИМАЕТ ДАННЫХ (POST без тела, очередь читает
#    сама), поэтому даже с валидным ключом ей нельзя продиктовать ни payload,
#    ни URL получателя.
#
#    Секреты, которые обязан завести Олег ДО первого вызова:
#      • Function Secret WEBHOOK_DISPATCH_KEY  (то же значение — в Vault под
#        именем webhook_dispatch_key, см. 089);
#      • Vault webhook_dispatch_url = https://<ref>.supabase.co/functions/v1/webhook-dispatch
[functions.webhook-dispatch]
verify_jwt = false

# S-INN-1: автозаполнение реквизитов компании по ИНН (прокси к DaData findById/party).
#
# verify_jwt = true — тот же контур, что у ai-summarize/ai-run: анониму функция
# недоступна. Собственной проверки прав внутри нет и не нужно: функция НЕ ЧИТАЕТ и
# НЕ ПИШЕТ в БД проекта вовсе, а отдаёт публичные данные ЕГРЮЛ по ИНН. Реквизиты
# сохраняет пользователь обычным UPDATE из формы, под своими RLS-политиками —
# поэтому service_role здесь не запрашивается.
#
# Секрет, который обязан быть заведён ДО первого вызова: DADATA_API_KEY.
[functions.company-lookup]
verify_jwt = true

# S-QUICK-CAPTURE-1: разбор вставленного текста в поля контакта/компании (ai-capture).
#
# verify_jwt = true — тот же контур, что у ai-summarize/ai-run/company-lookup.
# Собственной проверки прав внутри нет и не требуется: функция НЕ ЧИТАЕТ и НЕ ПИШЕТ
# в БД проекта вовсе — она отдаёт разобранные поля клиенту, а сохраняет их
# пользователь обычным INSERT из модалки, под своими RLS-политиками. service_role
# поэтому не запрашивается: обойти RLS функции нечем.
#
# Секреты: ANTHROPIC_API_KEY (обязателен), AI_CAPTURE_MODEL (необязателен —
# переопределяет модель без правки кода).
[functions.ai-capture]
verify_jwt = true

# S-R3-VOICE-1: расшифровка аудио (transcribe) — Groq Whisper + вычитка Claude.
#
# verify_jwt = true — тот же контур, что у ai-capture/company-lookup. Собственной
# проверки прав внутри нет и не требуется: функция НЕ ЧИТАЕТ и НЕ ПИШЕТ в БД проекта
# вовсе. Готовый текст она отдаёт клиенту, а транскрипт в `transcripts` пишет
# пользователь обычным INSERT (useStartRun), под своими RLS-политиками —
# service_role поэтому не запрашивается: обойти RLS функции нечем.
#
# Аудио нигде не сохраняется: чанк живёт в памяти изолята на время запроса.
#
# Секреты: GROQ_API_KEY (обязателен для распознавания), ANTHROPIC_API_KEY
# (обязателен для вычитки, уже заведён), TRANSCRIBE_CLEANUP_MODEL (необязателен —
# переопределяет модель вычитки без правки кода, дефолт claude-sonnet-5).
[functions.transcribe]
verify_jwt = true

# S-TG-1: дренаж очереди telegram_outbox (telegram-send).
#
# ⚠️ verify_jwt = false — ВТОРАЯ функция проекта без проверки JWT на шлюзе, и
#    вынужденно по той же причине, что webhook-dispatch: её зовёт БД
#    (telegram_send_tick, 107) через pg_net, а у БД JWT нет. Взамен — своя
#    авторизация: заголовок X-Dispatch-Key сверяется без ранней остановки с
#    Function Secret TELEGRAM_SEND_KEY.
#
#    Второй контур: функция НЕ ПРИНИМАЕТ ДАННЫХ (POST без тела, очередь читает
#    сама), поэтому даже с валидным ключом ей нельзя продиктовать ни текст
#    сообщения, ни адресата.
#
#    Отступление от «edge не пишет в БД» — осознанное и описано в шапке
#    index.ts: браузера с сессией пользователя здесь нет, закрыть строку очереди
#    больше некому. telegram_outbox для authenticated закрыта полностью.
#
#    Секреты, которые нужны ДО первого вызова:
#      • TELEGRAM_BOT_TOKEN — токен бота от @BotFather. В БД не попадает никогда;
#      • TELEGRAM_SEND_KEY  (то же значение — в Vault под именем
#        telegram_send_key, см. 107);
#      • Vault telegram_send_url = https://<ref>.supabase.co/functions/v1/telegram-send
[functions.telegram-send]
verify_jwt = false

# S-TG-1: входящие апдейты Telegram (telegram-webhook). В спринте — только /start.
#
# ⚠️ verify_jwt = false — Telegram JWT НЕ НОСИТ и носить не может. Компенсация —
#    ОБЯЗАТЕЛЬНАЯ проверка заголовка X-Telegram-Bot-Api-Secret-Token против
#    Function Secret TELEGRAM_WEBHOOK_SECRET (значение задаётся при setWebhook).
#    Не совпал — 401. Без этой проверки endpoint открыт миру: любой, угадавший
#    URL, слал бы боту фальшивые /start и привязывал чужие профили.
#    Пустой секрет в окружении трактуется как «закрыто», а не как «пропускаем».
#
#    Идемпотентность — telegram_updates(update_id) (107): Telegram ретраит апдейт,
#    если ответ не пришёл за таймаут. На всё остальное функция отвечает 200 и
#    молчит: не-200 заставляет Telegram повторять по нарастающей и отключить хук.
#
#    Секреты: TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET.
[functions.telegram-webhook]
verify_jwt = false
